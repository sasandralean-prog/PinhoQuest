name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify foundation
        run: |
          chmod +x ./gradlew
          ./gradlew :quest-domain:test :quest-core:test :android-data:testDebugUnitTest :app:lintDebug :app:assembleDebug
