name: Android CI

on:
  push:
    branches:
      - main
      - feature/cr-0-runtime-consolidation
      - feature/p6-total-ui-refactor
      - feature/p6-garden-delight
  workflow_dispatch:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # LiteRT-LM 0.16.1 test classes target Java 21. Android bytecode stays
          # at the module-configured Java 17 target; this is the CI host JDK.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify FunctionGemma training fixtures
        run: python -m unittest discover -s tools/p3_training -p 'test_*.py'
      - name: Configure stable debug signing key (optional)
        shell: bash
        env:
          PINHOQUEST_DEBUG_KEYSTORE_BASE64: ${{ secrets.PINHOQUEST_DEBUG_KEYSTORE_BASE64 }}
          PINHOQUEST_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.PINHOQUEST_DEBUG_KEYSTORE_PASSWORD }}
          PINHOQUEST_DEBUG_KEY_ALIAS: ${{ secrets.PINHOQUEST_DEBUG_KEY_ALIAS }}
          PINHOQUEST_DEBUG_KEY_PASSWORD: ${{ secrets.PINHOQUEST_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$PINHOQUEST_DEBUG_KEYSTORE_BASE64" ] && [ -n "$PINHOQUEST_DEBUG_KEYSTORE_PASSWORD" ] && [ -n "$PINHOQUEST_DEBUG_KEY_ALIAS" ] && [ -n "$PINHOQUEST_DEBUG_KEY_PASSWORD" ]; then
            key_path="$RUNNER_TEMP/pinhoquest-debug.keystore"
            printf '%s' "$PINHOQUEST_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            echo "PINHOQUEST_DEBUG_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
            echo "PINHOQUEST_DEBUG_KEYSTORE_PASSWORD=$PINHOQUEST_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PINHOQUEST_DEBUG_KEY_ALIAS=$PINHOQUEST_DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PINHOQUEST_DEBUG_KEY_PASSWORD=$PINHOQUEST_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable debug signing configured."
          else
            echo "::warning::Stable debug signing secrets are not configured. This CI artifact uses a runner-generated debug key and may not install as an update over a previous CI APK."
          fi
      - name: Verify foundation
        run: |
          chmod +x ./gradlew
          ./gradlew :quest-domain:test :quest-core:test :android-data:testDebugUnitTest :litertlm-bridge:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:compileDebugAndroidTestKotlin
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test flower pixel-art pipeline on Android API 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            chmod +x ./gradlew
            test_exit=0; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pinhoquest.flora.FlowerPixelArtProcessorInstrumentedTest || test_exit=$?; out=app/build/outputs/flower-pixel-art-evidence; mkdir -p "$out"; for f in camellia-original.jpg camellia-sprite.png camellia-original-vs-sprite.png camellia-garden-collection-screen.png; do adb exec-out run-as com.pinhoquest cat "cache/flower-pixel-art-evidence/$f" > "$out/$f" 2>/dev/null || rm -f "$out/$f"; done; echo "Recovered flower evidence:"; ls -lah "$out"; exit "$test_exit"
      - name: Upload flower original-versus-sprite screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinhoquest-flower-visual-evidence
          path: app/build/outputs/flower-pixel-art-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Print complete Android Lint report
        if: always()
        shell: bash
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          fallback="app/build/reports/lint-results-debug.txt"
          if [ -f "$report" ]; then
            echo "=== Complete Android Lint report (all errors and warnings) ==="
            cat "$report"
          elif [ -f "$fallback" ]; then
            echo "=== Complete Android Lint report (all errors and warnings) ==="
            cat "$fallback"
          else
            echo "Android Lint text report was not generated."
          fi
      - name: Write APK SHA-256 checksum
        if: success()
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload debug APK and checksum
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/cr-0-runtime-consolidation' || github.ref == 'refs/heads/feature/p6-total-ui-refactor' || github.ref == 'refs/heads/feature/p6-garden-delight'
        uses: actions/upload-artifact@v4
        with:
          name: pinhoquest-v05-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7
